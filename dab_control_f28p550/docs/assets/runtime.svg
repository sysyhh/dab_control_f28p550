<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img" aria-labelledby="title">
<title id="title">DAB 运行关系：外设采样、控制中断、PWM 装载与主循环</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#58708a"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f8fc" rx="18"/>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#19354f} .label{font-size:20px;font-weight:600} .small{font-size:16px} .muted{fill:#577086}</style><text class="label" x="28" y="38">固定节拍的采样与控制</text><rect x="30" y="68" width="215" height="104" rx="10" fill="#e2eefb" stroke="#c0d2e2"/><text class="label" x="137.5" y="102" text-anchor="middle">EPWM1 / ADC</text><text class="small" x="137.5" y="129" text-anchor="middle">零点触发；两 ADC</text><text class="small" x="137.5" y="152" text-anchor="middle">周期顶点读四项结果</text><rect x="288" y="68" width="220" height="104" rx="10" fill="#e2eefb" stroke="#c0d2e2"/><text class="label" x="398.0" y="102" text-anchor="middle">10 kHz 控制中断</text><text class="small" x="398.0" y="129" text-anchor="middle">检查数据与保护</text><text class="small" x="398.0" y="152" text-anchor="middle">软启动 / 可选 PI / NN 缓存</text><rect x="555" y="68" width="218" height="104" rx="10" fill="#e2eefb" stroke="#c0d2e2"/><text class="label" x="664.0" y="102" text-anchor="middle">完整 PWM 参数包</text><text class="small" x="664.0" y="129" text-anchor="middle">寄存器值 + 原参数</text><text class="small" x="664.0" y="152" text-anchor="middle">序号 + 等待期限</text><rect x="818" y="68" width="250" height="104" rx="10" fill="#e2eefb" stroke="#c0d2e2"/><text class="label" x="943.0" y="102" text-anchor="middle">EPWM7 提交与装载</text><text class="small" x="943.0" y="129" text-anchor="middle">主零点 / 从同步</text><text class="small" x="943.0" y="152" text-anchor="middle">四个桥臂 EPWM7/4/5/10</text><path d="M245,120 L288,120" stroke="#58708a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M508,120 L555,120" stroke="#58708a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M773,120 L818,120" stroke="#58708a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text class="label" x="28" y="235">主循环：推理、请求和遥测</text><rect x="30" y="264" width="268" height="104" rx="10" fill="#e5f3eb" stroke="#c0d2e2"/><text class="label" x="164.0" y="298" text-anchor="middle">NN 后台服务</text><text class="small" x="164.0" y="325" text-anchor="middle">默认 FPU；未来 NPU</text><text class="small" x="164.0" y="348" text-anchor="middle">只发布完整、有效的结果</text><rect x="348" y="264" width="268" height="104" rx="10" fill="#e5f3eb" stroke="#c0d2e2"/><text class="label" x="482.0" y="298" text-anchor="middle">启停与故障请求</text><text class="small" x="482.0" y="325" text-anchor="middle">状态 + ADC + NN + 保护</text><text class="small" x="482.0" y="348" text-anchor="middle">共同决定是否接受</text><rect x="666" y="264" width="402" height="104" rx="10" fill="#e5f3eb" stroke="#c0d2e2"/><text class="label" x="867.0" y="298" text-anchor="middle">SCI 队列 + 看门狗</text><text class="small" x="867.0" y="325" text-anchor="middle">不等待串口空间；有新控制进度才喂狗</text><text class="small" x="867.0" y="348" text-anchor="middle">默认 10 Hz 三通道显示</text><path d="M298,315 H322 V194 H398 V178" stroke="#58708a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text class="small" x="160" y="206">结果缓存</text><path d="M480,264 L430,178" stroke="#58708a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="429" width="1038" height="100" rx="10" fill="#fff0e1" stroke="#c0d2e2"/><text class="label" x="549.0" y="463" text-anchor="middle">外部故障直接关闭输出</text><text class="small" x="549.0" y="490" text-anchor="middle">GPIO60 → Input XBAR1 → TZ1 → 四路 OST；不依赖 CPU 中断执行</text><text class="small" x="31" y="556">图示为当前软件关系；引脚、实际关断延迟与四桥波形需实板确认。</text></svg>