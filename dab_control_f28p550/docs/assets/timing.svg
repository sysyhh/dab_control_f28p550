<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="title">
<title id="title">EPWM1 采样、读取及控制时序：每周期 100 微秒</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#58708a"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f8fc" rx="18"/>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#19354f} .label{font-size:20px;font-weight:600} .small{font-size:16px} .muted{fill:#577086}</style><text class="label" x="28" y="40">EPWM1：7500 上下计数，TBCLK=150 MHz</text><path d="M150,219 L575,89 L1000,219" fill="none" stroke="#377fc1" stroke-width="4"/><path d="M150,233 L1000,233" fill="none" stroke="#a8becf" stroke-width="2"/><path d="M150,72 L150,450" stroke="#c9d6e2" stroke-width="1.5" stroke-dasharray="6 5"/><text class="small" x="150" y="60" text-anchor="middle">0 μs / ZERO</text><path d="M575,72 L575,450" stroke="#c9d6e2" stroke-width="1.5" stroke-dasharray="6 5"/><text class="small" x="575" y="60" text-anchor="middle">50 μs / PERIOD</text><path d="M1000,72 L1000,450" stroke="#c9d6e2" stroke-width="1.5" stroke-dasharray="6 5"/><text class="small" x="1000" y="60" text-anchor="middle">100 μs / ZERO</text><text class="small" x="172" y="180">向上计数</text><text class="small" x="719" y="205">向下计数</text><rect x="60" y="270" width="320" height="103" rx="10" fill="#e2eefb" stroke="#c0d2e2"/><text class="label" x="220.0" y="304" text-anchor="middle">SOCA 同时触发 A/B</text><text class="small" x="220.0" y="331" text-anchor="middle">各 ADC 的 SOC0 → SOC1</text><text class="small" x="220.0" y="354" text-anchor="middle">等待 EOC1（不是四项同时采样）</text><rect x="413" y="270" width="355" height="103" rx="10" fill="#e2eefb" stroke="#c0d2e2"/><text class="label" x="590.5" y="304" text-anchor="middle">EPWM1 控制中断</text><text class="small" x="590.5" y="331" text-anchor="middle">检查完成和溢出、读结果</text><text class="small" x="590.5" y="354" text-anchor="middle">保护 → 控制 → 保存 PWM 请求</text><text class="small" x="50" y="415">数据采样比正常读取早约 50 μs；数据年龄时间戳记录的是读取结束。</text><text class="small" x="50" y="448">下一次零点前保留 150 个计数（约 1 μs）的读取检查余量。</text><text class="small" x="50" y="497">功率 PWM 独立运行于 15～60 kHz，EPWM7 装载边界另行确认；此图未按比例表示 ADC 转换耗时。</text></svg>