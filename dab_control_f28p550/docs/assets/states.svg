<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 530" role="img" aria-labelledby="title">
<title id="title">DAB 状态：待机、软启动、运行和人工故障清除</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#58708a"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f8fc" rx="18"/>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#19354f} .label{font-size:20px;font-weight:600} .small{font-size:16px} .muted{fill:#577086}</style><text class="label" x="28" y="40">输出释放由首包装载与保护条件共同决定</text><rect x="35" y="99" width="265" height="110" rx="10" fill="#e2eefb" stroke="#c0d2e2"/><text class="label" x="167.5" y="133" text-anchor="middle">STANDBY / 待机</text><text class="small" x="167.5" y="160" text-anchor="middle">输出关闭</text><text class="small" x="167.5" y="183" text-anchor="middle">默认启动被板确认门控阻止</text><rect x="415" y="99" width="265" height="110" rx="10" fill="#e2eefb" stroke="#c0d2e2"/><text class="label" x="547.5" y="133" text-anchor="middle">SOFT_START / 软启动</text><text class="small" x="547.5" y="160" text-anchor="middle">首包确认后释放</text><text class="small" x="547.5" y="183" text-anchor="middle">按新装载序号渐变</text><rect x="795" y="99" width="265" height="110" rx="10" fill="#e2eefb" stroke="#c0d2e2"/><text class="label" x="927.5" y="133" text-anchor="middle">RUN / 运行</text><text class="small" x="927.5" y="160" text-anchor="middle">持续检查采样、NN 和期限</text><text class="small" x="927.5" y="183" text-anchor="middle">不等于闭环已验证</text><path d="M300,148 L415,148" stroke="#58708a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text class="small" x="312" y="122">启动通过</text><path d="M680,148 L795,148" stroke="#58708a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text class="small" x="688" y="122">渐变完成</text><rect x="415" y="334" width="265" height="110" rx="10" fill="#fff0e1" stroke="#c0d2e2"/><text class="label" x="547.5" y="368" text-anchor="middle">FAULT / 故障</text><text class="small" x="547.5" y="395" text-anchor="middle">保持关断及首次记录</text><text class="small" x="547.5" y="418" text-anchor="middle">新故障脉冲重启恢复等待</text><path d="M548,209 L548,334" stroke="#58708a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text class="small" x="563" y="278">任何故障</text><path d="M925,209 V388 H682" fill="none" stroke="#58708a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M415,389 H270 V211" fill="none" stroke="#58708a" stroke-width="2.5" marker-end="url(#arrow)"/><text class="small" x="34" y="305">连续正常 ≥5 ms</text><text class="small" x="34" y="332">+ ADC 连续 50 帧</text><text class="small" x="34" y="359">+ 人工清除</text><text class="small" x="30" y="488">正常停止 → STANDBY；故障中停止仍保持 FAULT；清除成功也不会自动启动。</text></svg>